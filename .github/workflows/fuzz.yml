# Fuzzes the message parser for longer than CI does, once a week and on demand.
# A crashing input is uploaded as an artifact: add it under
# internal/parser/testdata/fuzz/ with the fix, so it stays a regression test.
#
# Actions are pinned by commit SHA; the comment shows the release.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target, such as 10m
        default: 10m

permissions: {}

env:
  GO_VERSION: "1.27.x"

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: make fuzz FUZZTIME="$FUZZTIME"
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/parser/testdata/fuzz/
          if-no-files-found: ignore
