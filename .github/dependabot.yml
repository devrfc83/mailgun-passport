# Keeps dependencies current with weekly pull requests: Go modules, the
# Dockerfile's base images (pinned by digest) and the GitHub Actions used by
# the workflows (pinned by SHA). CI runs on each pull request, govulncheck
# included.
version: 2
updates:
  # One pull request for all module updates, so golang.org/x/net, x/text and
  # x/sys, which usually move together, arrive and are tested as one change.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
